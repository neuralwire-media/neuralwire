<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
		<link rel="shortcut icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&family=Space+Mono:wght@400&display=swap"
			onload="
				this.onload = null;
				this.rel = 'stylesheet';
			"
		/>
		<noscript>
			<link
				rel="stylesheet"
				href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&family=Space+Mono:wght@400&display=swap"
			/>
		</noscript>
		<style>
			:root {
				color-scheme: dark;
			}
			html,
			body {
				background-color: #0a0e17;
				color: #f8fafc;
				margin: 0;
				padding: 0;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div
			id="initial-shell"
			style="
				height: 64px;
				border-bottom: 1px solid rgba(255, 255, 255, 0.08);
				background: #0a0e17;
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 0 1rem;
				max-width: 80rem;
				margin: 0 auto;
				box-sizing: border-box;
			"
		>
			<div style="display: flex; align-items: center; gap: 0.5rem">
				<span
					style="
						border: 1px solid rgba(34, 211, 238, 0.3);
						background: rgba(34, 211, 238, 0.1);
						padding: 0.125rem 0.375rem;
						border-radius: 0.25rem;
						font-family: monospace;
						font-size: 12px;
						color: #22d3ee;
						font-weight: bold;
					"
					>NW</span
				>
				<span
					style="
						font-family:
							system-ui,
							-apple-system,
							sans-serif;
						font-size: 18px;
						font-weight: bold;
						color: #ffffff;
						text-transform: uppercase;
					"
					>NEURAL<span style="color: #22d3ee">WIRE</span></span
				>
			</div>
			<div style="height: 8px; width: 8px; border-radius: 50%; background: #22d3ee"></div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
