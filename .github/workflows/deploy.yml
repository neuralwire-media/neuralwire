name: Deploy to VPS

# Automatically triggers when a version tag (v*.*.*) is pushed.
# Also allows manual triggering from the GitHub Actions UI (workflow_dispatch).

'on':
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git Ref / Branch / Tag to deploy (default: main)'
        required: false
        default: 'main'

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Auto Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "==> Deploying Neuralwire on VPS..."
            cd /app/neuralwire
            git config --global --add safe.directory /app/neuralwire
            git fetch --all --tags

            TARGET_REF="${{ github.event.inputs.git_ref || github.ref_name || 'main' }}"
            echo "==> Target ref to deploy: $TARGET_REF"
            git checkout "$TARGET_REF"
            if git show-ref --verify --quiet "refs/heads/$TARGET_REF"; then
              git pull origin "$TARGET_REF"
            fi

            docker compose up -d --build

            echo "==> Verifying container health & uptime..."
            MAX_RETRIES=6
            RETRY_COUNT=0
            HEALTH_OK=0

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              RETRY_COUNT=$((RETRY_COUNT+1))
              echo "Checking health probe (attempt $RETRY_COUNT/$MAX_RETRIES)..."
              sleep 5

              STATUS=$(docker compose ps --format '{{.Status}}' neuralwire 2>/dev/null || true)
              if echo "$STATUS" | grep -iqE "restart|exit"; then
                echo "ERROR: Container is in bad state: $STATUS"
                docker compose logs --tail=100 neuralwire
                exit 1
              fi

              if curl -f -s -m 5 http://127.0.0.1:8080/api/healthz > /dev/null; then
                echo "Healthcheck probe succeeded! HTTP 200 OK received from /api/healthz."
                HEALTH_OK=1
                break
              fi
            done

            if [ $HEALTH_OK -ne 1 ]; then
              echo "ERROR: Healthcheck probe timed out after 30 seconds."
              echo "==> Container status:"
              docker compose ps
              echo "==> Recent container logs:"
              docker compose logs --tail=100 neuralwire
              exit 1
            fi

            echo "==> Verifying container status..."
            docker compose ps
            echo "==> Deployment completed successfully!"
