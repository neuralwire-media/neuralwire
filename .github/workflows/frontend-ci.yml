name: Frontend CI

# Runs on every push/PR touching frontend code (or this workflow). Build,
# type-check, and lint must pass before merge. Uses fast-path skip
# when changes are backend-only to satisfy required branch protection checks quickly.

on:
  pull_request:
    branches: [main]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  frontend:
    name: Install, check, lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for frontend changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend-ci.yml'

      - name: Skip notice
        if: steps.filter.outputs.frontend != 'true'
        run: echo "No frontend changes detected. Fast-path skip active."

      - name: Set up Node
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.filter.outputs.frontend == 'true'
        run: npm ci

      - name: Security audit (npm audit)
        if: steps.filter.outputs.frontend == 'true'
        run: npm audit --audit-level=high

      - name: Type-check (svelte-check)
        if: steps.filter.outputs.frontend == 'true'
        run: npm run check

      - name: Lint (prettier + eslint)
        if: steps.filter.outputs.frontend == 'true'
        run: npm run lint

      - name: Build
        if: steps.filter.outputs.frontend == 'true'
        run: npm run build
